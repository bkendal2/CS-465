<div class="row">
  <div class="col-12 col-md-6 offset-md-3">
    <h2>Admin Login</h2>

    <div *ngIf="formError" class="alert alert-danger">
      {{ formError }}
    </div>

    <form (ngSubmit)="onLoginSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input
          [(ngModel)]="user.email"
          name="email"
          type="email"
          class="form-control"
          placeholder="Email">
      </div>

      <div class="form-group mt-2">
        <label>Password</label>
        <input
          [(ngModel)]="password"
          name="password"
          type="password"
          class="form-control"
          placeholder="Password">
      </div>

      <button type="submit" class="btn btn-primary mt-3">Login</button>
    </form>
  </div>
</div>
